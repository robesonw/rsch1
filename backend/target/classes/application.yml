spring:
  application:
    name: paralleliq
  threads:
    virtual:
      enabled: true                      # Java 21 virtual threads — mandatory, never disable

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:paralleliq};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate                 # Flyway manages schema — never change this
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

resilience4j:
  circuitbreaker:
    instances:
      kafka:   { slidingWindowSize: 10, failureRateThreshold: 50, waitDurationInOpenState: 30s }
      ibm-mq:  { slidingWindowSize: 5,  failureRateThreshold: 60, waitDurationInOpenState: 60s }
      solace:  { slidingWindowSize: 5,  failureRateThreshold: 60, waitDurationInOpenState: 60s }
      sftp:    { slidingWindowSize: 5,  failureRateThreshold: 50, waitDurationInOpenState: 30s }
  retry:
    instances:
      kafka:   { maxAttempts: 3, waitDuration: 2s, exponentialBackoffMultiplier: 2 }
      ibm-mq:  { maxAttempts: 3, waitDuration: 3s, exponentialBackoffMultiplier: 2 }
      solace:  { maxAttempts: 3, waitDuration: 2s }
      sftp:    { maxAttempts: 2, waitDuration: 5s }
  timelimiter:
    instances:
      kafka:   { timeoutDuration: 30s }
      ibm-mq:  { timeoutDuration: 60s }
      solace:  { timeoutDuration: 30s }
      sftp:    { timeoutDuration: 120s }

paralleliq:
  execution:
    core-pool-size: ${EXEC_CORE_POOL:10}
    max-pool-size: ${EXEC_MAX_POOL:50}
    queue-capacity: ${EXEC_QUEUE:100}
    thread-name-prefix: piq-exec-
    shutdown-grace-period: ${SHUTDOWN_GRACE:60s}
  cache:
    provider: ${CACHE_PROVIDER:caffeine}     # caffeine | redis
  websocket:
    relay: ${WS_RELAY:in-process}            # in-process | redis (for multi-instance)
  scheduler:
    cron: "0 * * * * *"
    lock-at-most-for: 55s
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production}
      expiry-hours: ${JWT_EXPIRY_HOURS:8}
  credentials:
    provider: ${CREDENTIAL_PROVIDER:local}   # local | azure-key-vault
    azure:
      vault-url: ${AZURE_VAULT_URL:}
  masking:
    enabled: ${MASKING_ENABLED:true}
  alerts:
    default-match-rate-threshold: ${ALERT_MATCH_RATE:95.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: paralleliq
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        paralleliq.run.duration: true
        paralleliq.connector.capture.duration: true
      percentiles:
        "[paralleliq.run.duration]": 0.5,0.90,0.95,0.99

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.paralleliq: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
paralleliq:
  security:
    jwt:
      secret: dev-secret-32-chars-minimum-ok
logging:
  level:
    com.paralleliq: DEBUG
