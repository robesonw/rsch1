# ═══════════════════════════════════════════════════════════════════
# ParallelIQ Agent — application.properties
#
# Location: same folder as the JAR, or specify with:
#   java -jar paralleliq-agent.jar --spring.config.location=C:\paralleliq\config\
#
# Sensitive values (passwords, keys): use environment variables.
# Set them in Windows via System Properties > Environment Variables,
# or in the Task Scheduler action as a wrapper batch file:
#   set DB_USERNAME=myuser && java -jar paralleliq-agent.jar
# ═══════════════════════════════════════════════════════════════════

# ── Agent identity ────────────────────────────────────────────────
# Unique name for this server — appears in the API's agent registry
paralleliq.agent.id=WIN-SERVER-01
paralleliq.agent.version=1.0.0

# ── API connection ────────────────────────────────────────────────
# URL of the paralleliq-api deployed in PCF
paralleliq.api.base-url=https://paralleliq-api.your-pcf-domain.com
# Shared key that authenticates the agent to the API
# Generate with: openssl rand -hex 32
paralleliq.api.agent-key=${AGENT_KEY:change-me-before-use}

# ── HTTP client config ────────────────────────────────────────────
paralleliq.http.connect-timeout-ms=10000
paralleliq.http.read-timeout-ms=30000

# ── IBM MQ ────────────────────────────────────────────────────────
# Connection factory properties are passed per-run from the API.
# These are fallback defaults for the MQ client library.
# IBM.MQ.queueManager set per run — not here
ibm.mq.connectionMode=1
ibm.mq.channel=SYSTEM.DEF.SVRCONN

# MQ SSL — certificate paths on this Windows Server
# Add these JVM args to the Task Scheduler action if MQ uses TLS:
#   -Djavax.net.ssl.keyStore=C:\paralleliq\certs\mq-client.jks
#   -Djavax.net.ssl.keyStorePassword=${MQ_KEYSTORE_PASS}
#   -Djavax.net.ssl.trustStore=C:\paralleliq\certs\mq-truststore.jks
#   -Djavax.net.ssl.trustStorePassword=${MQ_TRUSTSTORE_PASS}
#   -Dcom.ibm.mq.cfg.useIBMCipherMappings=false

# ── Kafka ─────────────────────────────────────────────────────────
# Connection properties (bootstrap-servers etc.) come per-run from API.
# Kafka TLS — uncomment and set paths if your Kafka cluster uses mTLS:
# paralleliq.connector.kafka.ssl.keystore.location=C:\\paralleliq\\certs\\kafka-client.jks
# paralleliq.connector.kafka.ssl.keystore.password=${KAFKA_KEYSTORE_PASS}
# paralleliq.connector.kafka.ssl.truststore.location=C:\\paralleliq\\certs\\kafka-truststore.jks
# paralleliq.connector.kafka.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASS}
# paralleliq.connector.kafka.ssl.key.password=${KAFKA_KEY_PASS}
# paralleliq.connector.kafka.security.protocol=SSL

# ── Solace ────────────────────────────────────────────────────────
# Connection properties come per-run from API.
# Solace TLS — uncomment if your Solace broker uses TLS:
# paralleliq.connector.solace.ssl.trust-store=C:\\paralleliq\\certs\\solace-truststore.jks
# paralleliq.connector.solace.ssl.trust-store-password=${SOLACE_TRUSTSTORE_PASS}

# ── SFTP ──────────────────────────────────────────────────────────
# Private key location for SSH authentication.
# The key file itself must be on this Windows Server.
paralleliq.connector.sftp.private-key-path=C:\\paralleliq\\certs\\sftp-id_rsa
paralleliq.connector.sftp.private-key-passphrase=${SFTP_KEY_PASS:}
paralleliq.connector.sftp.connection-timeout-ms=30000

# ── Database connector ────────────────────────────────────────────
# Target databases for DB connector — credentials from env vars
# Connection strings come per-run from the API environment config.
paralleliq.connector.db.connection-timeout-ms=30000
paralleliq.connector.db.max-pool-per-environment=5

# SQL Server source/target — if target DB uses a self-signed cert:
# Add to JDBC URL per environment: trustServerCertificate=true
# OR import the SQL Server cert into the JVM truststore:
#   keytool -import -trustcacerts -alias sqlserver-ca \
#     -file C:\paralleliq\certs\sqlserver-ca.cer \
#     -keystore "C:\Program Files\Java\jre8\lib\security\cacerts" \
#     -storepass changeit

# ── Resilience4j ─────────────────────────────────────────────────
resilience4j.retry.instances.mq.maxAttempts=3
resilience4j.retry.instances.mq.waitDuration=3s
resilience4j.retry.instances.kafka.maxAttempts=3
resilience4j.retry.instances.kafka.waitDuration=2s
resilience4j.retry.instances.solace.maxAttempts=3
resilience4j.retry.instances.solace.waitDuration=2s
resilience4j.retry.instances.sftp.maxAttempts=2
resilience4j.retry.instances.sftp.waitDuration=5s

# ── Logging ───────────────────────────────────────────────────────
# Log file — Task Scheduler does not capture stdout by default.
# Write to a log file so you can review executions.
logging.file.name=C:\\paralleliq\\logs\\agent.log
logging.file.max-size=50MB
logging.file.max-history=10
logging.level.com.paralleliq=INFO
logging.level.com.ibm.mq=WARN
logging.level.org.apache.kafka=WARN
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{runId}] - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{runId}] - %msg%n

# ── Spring (disable web server — agent does not accept connections) ─
# The agent only makes outbound HTTP calls to the API.
# It does NOT run a web server.
spring.main.web-application-type=none
