# ── Server ────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# HTTPS — configure when deploying outside PCF (PCF handles TLS termination)
# server.ssl.enabled=true
# server.ssl.key-store=${KEYSTORE_PATH}
# server.ssl.key-store-password=${KEYSTORE_PASS}
# server.ssl.key-store-type=PKCS12

# ── Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:paralleliq};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA — validate only, schema managed by manual SQL scripts in db/scripts/
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Security ──────────────────────────────────────────────────────
paralleliq.security.jwt.secret=${JWT_SECRET:change-me-before-production-min-32-chars}
paralleliq.security.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}

# Active Directory / LDAP — uncomment and configure for enterprise AD auth
# spring.ldap.urls=ldaps://${AD_HOST:your-ad-server}:636
# spring.ldap.base=${AD_BASE:dc=yourcompany,dc=com}
# spring.ldap.username=${AD_BIND_USER:}
# spring.ldap.password=${AD_BIND_PASS:}

# ── Agent communication ───────────────────────────────────────────
# How long a run stays in QUEUED before it's considered abandoned
paralleliq.agent.run-timeout-minutes=${AGENT_RUN_TIMEOUT:60}
# How often the API checks for timed-out runs
paralleliq.agent.cleanup-cron=0 */5 * * * *

# ── Scheduling ────────────────────────────────────────────────────
paralleliq.scheduler.cron=0 * * * * *
paralleliq.scheduler.lock-at-most-for=55s

# ── File upload ───────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=paralleliq-api
management.metrics.tags.environment=${ENVIRONMENT:local}

# ── API docs ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ──────────────────────────────────────────────────────
logging.level.com.paralleliq=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{runId}] - %msg%n
